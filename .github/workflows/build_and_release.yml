name: Build & Release Desktop Studio

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Windows x86_64 (DirectML + DirectX 12)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React UI
        working-directory: apps/desktop/ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Release Binary
        run: cargo build -p desktop --release

      - name: Package Windows Standalone Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/VideoUpscaler-Windows" -Force
          Copy-Item "target/release/video-upscaler.exe" "dist/VideoUpscaler-Windows/Video Upscaler.exe"
          Copy-Item -Recurse "apps/desktop/ui/dist" "dist/VideoUpscaler-Windows/apps/desktop/ui/dist"
          Compress-Archive -Path "dist/VideoUpscaler-Windows/*" -DestinationPath "dist/VideoUpscaler-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoUpscaler-Windows-x64
          path: dist/VideoUpscaler-Windows-x64.zip

  build-macos:
    name: macOS Apple Silicon (CoreML + Metal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React UI
        working-directory: apps/desktop/ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            brew install ffmpeg
          fi

      - name: Build Release Binary
        run: cargo build -p desktop --release --target aarch64-apple-darwin

      - name: Package macOS Application Bundle
        run: |
          mkdir -p "dist/Video Upscaler.app/Contents/MacOS"
          mkdir -p "dist/Video Upscaler.app/Contents/Resources/apps/desktop/ui"
          cp "target/aarch64-apple-darwin/release/video-upscaler" "dist/Video Upscaler.app/Contents/MacOS/Video Upscaler"
          cp -r "apps/desktop/ui/dist" "dist/Video Upscaler.app/Contents/Resources/apps/desktop/ui/dist"
          cp "apps/desktop/resources/Info.plist" "dist/Video Upscaler.app/Contents/Info.plist"
          printf "APPL????" > "dist/Video Upscaler.app/Contents/PkgInfo"
          chmod +x "dist/Video Upscaler.app/Contents/MacOS/Video Upscaler"

          # Generate native .icns icon from source icon
          if [ -f "apps/desktop/icons/icon.png" ]; then
            mkdir -p icon.iconset
            sips -z 16 16     apps/desktop/icons/icon.png --out icon.iconset/icon_16x16.png
            sips -z 32 32     apps/desktop/icons/icon.png --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32     apps/desktop/icons/icon.png --out icon.iconset/icon_32x32.png
            sips -z 64 64     apps/desktop/icons/icon.png --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128   apps/desktop/icons/icon.png --out icon.iconset/icon_128x128.png
            sips -z 256 256   apps/desktop/icons/icon.png --out icon.iconset/icon_128x128@2x.png
            sips -z 256 256   apps/desktop/icons/icon.png --out icon.iconset/icon_256x256.png
            sips -z 512 512   apps/desktop/icons/icon.png --out icon.iconset/icon_256x256@2x.png
            sips -z 512 512   apps/desktop/icons/icon.png --out icon.iconset/icon_512x512.png
            iconutil -c icns icon.iconset -o "dist/Video Upscaler.app/Contents/Resources/AppIcon.icns"
            rm -rf icon.iconset
          fi

          # Ad-hoc codesign the application bundle for Apple Silicon
          codesign --force --deep --sign - "dist/Video Upscaler.app"

          # Package cleanly with ditto to preserve bundle metadata, permissions, and signatures
          ditto -c -k --sequesterRsrc --keepParent "dist/Video Upscaler.app" "dist/VideoUpscaler-macOS-AppleSilicon.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoUpscaler-macOS-AppleSilicon
          path: dist/VideoUpscaler-macOS-AppleSilicon.zip
